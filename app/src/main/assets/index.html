  body {

    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  @keyframes floatUp {
    0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
    50% { transform: translateY(-20px) rotate(180deg); opacity: 0.6; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.2); }
    20% { transform: scale(1); }
    30% { transform: scale(1.15); }
    40% { transform: scale(1); }
  }

  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,182,193,0.3) 100%);
    pointer-events: none;
  }

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 32px;
    padding: 48px 40px;
    max-width: 540px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    box-shadow:
      0 8px 32px rgba(233, 30, 99, 0.15),
      0 2px 8px rgba(255, 255, 255, 0.3) inset;
    animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    opacity: 0;
    animation-delay: 0.3s;
  }

  .title-text {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #e91e63, #9c27b0, #e91e63);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    margin-bottom: 6px;
  }

  .heart-icon {
    font-size: 32px;
    display: block;
    animation: heartbeat 2s ease-in-out infinite;
    margin: 10px 0 16px;
  }

  .date-text {
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(136, 14, 79, 0.55);
    margin-bottom: 24px;

    height: 2px;
    background: linear-gradient(90deg, transparent, #e91e63, transparent);
    margin: 0 auto 24px;
    border-radius: 2px;

    font-weight: 400;
    font-style: italic;
    line-height: 1.65;
    color: #4a0e2e;
    margin: 0 0 28px 0;
    position: relative;
    padding: 0 10px;

    content: '\201C';
    font-size: 68px;
    font-style: normal;
    color: rgba(233, 30, 99, 0.13);
    position: absolute;
    top: -28px;
    left: -8px;
    font-family: 'Playfair Display', Georgia, serif;

    content: '\201D';
    font-size: 68px;
    font-style: normal;

function getDayOfYear() {
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var diff = now - start;
  return Math.floor(diff / 86400000);
}

function formatDate() {
  var now = new Date();
  var months = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  var days = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  return days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
}

  var size = Math.random() * 8 + 4;
  s.style.width = size + "px";
  s.style.height = size + "px";
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 100 + "%";
  s.style.animation = "floatUp " + (Math.random()*3+3) + "s ease-in-out " + (Math.random()*5) + "s infinite";
  s.style.opacity = Math.random() * 0.4 + 0.1;
  document.body.appendChild(s);
}

// Set quote
var idx = getDayOfYear() % quotes.length;
document.getElementById("date").textContent = formatDate();
document.getElementById("quote").textContent = quotes[idx].t;
document.getElementById("emoji").textContent = quotes[idx].e;
</script>
</body>
